name = "MeselsonStahl"
version = "0.1.0"
keywords = ["math", "biology", "philosophy of science"]
defaultTargets = ["MeselsonStahl"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false # Mathlib house-style linters off: this is a teaching project
maxSynthPendingDepth = 3
weak.linter.style.header = false # project is MIT, not Apache like Mathlib

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "62f3addadd0f6b58ac6ddd85c0ceec85012d64a9"

[[lean_lib]]
name = "MeselsonStahl"
